{% extends 'auth.html' %}{% set eyebrow='START YOUR JOURNEY' %}{% set heading='Create account' %}{% set subtitle='Save predictions and keep your property research in one place.' %}{% block title %}Create account{% endblock %}
{% block form %}<form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Your name<input class="form-control" name="name" autocomplete="name" required maxlength="100"></label><label>Email address<input class="form-control" type="email" name="email" autocomplete="email" required></label><label>Password <small class="text-muted">(6 characters minimum)</small><input class="form-control" type="password" name="password" autocomplete="new-password" minlength="6" required></label><button class="btn btn-dark btn-lg rounded-pill w-100">Create account <span>↗</span></button></form><p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>{% endblock %}
