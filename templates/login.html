{% extends 'auth.html' %}{% set eyebrow='WELCOME BACK' %}{% set heading='Log in' %}{% set subtitle='Access your saved estimates and market insights.' %}{% block title %}Log in{% endblock %}
{% block form %}<form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email address<input class="form-control" type="email" name="email" autocomplete="email" required></label><label>Password<input class="form-control" type="password" name="password" autocomplete="current-password" required></label><button class="btn btn-dark btn-lg rounded-pill w-100">Log in <span>↗</span></button></form><p class="auth-switch">New to Everlight? <a href="{{ url_for('register') }}">Create an account</a></p>{% endblock %}
